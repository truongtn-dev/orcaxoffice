<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OrcaX Word</title>
    <link rel="stylesheet" href="../shared/taskpane.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="../../src/word/core.browser.js"></script>
  </head>
  <body>
    <main>
      <p class="lead">OrcaX Word · định dạng & kiểm tra cục bộ</p>
      <h1>Hồ sơ và kiểm tra</h1>
      <p id="status" class="status">Đang khởi tạo…</p>

      <form id="loginForm" class="panel">
        <label>API <input id="apiOrigin" value="http://localhost:3001" required /></label>
        <label>Email <input id="email" type="email" required /></label>
        <label>Mật khẩu <input id="password" type="password" required /></label>
        <div class="actions">
          <button type="submit">Đăng nhập</button>
          <button type="button" class="secondary" id="logoutBtn">Đăng xuất</button>
        </div>
      </form>

      <div class="panel">
        <label
          >Hồ sơ Word
          <select id="profileId"></select
        ></label>
        <div class="actions">
          <button type="button" id="validateBtn">Kiểm tra</button>
          <button type="button" id="applyBtn">Xem trước / Áp dụng</button>
        </div>
        <h2>Xem trước thay đổi</h2>
        <div id="preview">Chưa có.</div>
        <h2>Báo cáo</h2>
        <div id="report">Chưa có.</div>
      </div>
    </main>
    <script src="./taskpane.page.js"></script>
  </body>
</html>
