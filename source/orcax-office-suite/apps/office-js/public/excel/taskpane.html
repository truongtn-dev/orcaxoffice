<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OrcaX Excel</title>
    <link rel="stylesheet" href="../shared/taskpane.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="../../src/excel/core.browser.js"></script>
  </head>
  <body>
    <main>
      <p class="lead">OrcaX Excel · tối ưu in A4 cục bộ</p>
      <h1>Hồ sơ in và PDF</h1>
      <p id="status" class="status">Đang khởi tạo…</p>

      <form id="loginForm" class="panel">
        <label>API <input id="apiOrigin" value="http://localhost:3001" required /></label>
        <label>Email <input id="email" type="email" required /></label>
        <label>Mật khẩu <input id="password" type="password" required /></label>
        <div class="actions">
          <button type="submit">Đăng nhập</button>
          <button type="button" class="secondary" id="logoutBtn">Đăng xuất</button>
        </div>
      </form>

      <div class="panel">
        <label
          >Hồ sơ Excel
          <select id="profileId"></select
        ></label>
        <div class="actions">
          <button type="button" id="previewBtn">Xem trước</button>
          <button type="button" id="applyBtn">Áp dụng</button>
          <button type="button" class="secondary" id="pdfBtn">Xuất PDF</button>
        </div>
        <h2>Cấu hình dự kiến</h2>
        <pre id="preview">Chưa có.</pre>
      </div>
    </main>
    <script src="./taskpane.page.js"></script>
  </body>
</html>
