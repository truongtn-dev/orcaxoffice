# Local PostgreSQL only. Interpolation reads the repo-root env file:
# docker compose --env-file .env -f infrastructure/deployment/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
    ports:
      - '${DATABASE_PORT:?DATABASE_PORT is required}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - orcax_postgres:/var/lib/postgresql/data

volumes:
  orcax_postgres:
